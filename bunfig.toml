"$schema" = "https://www.schemastore.org/bunfig.json"

[run]
bun = true
noOrphans = true

[install]
auto = "disable"
linker = "isolated"
# hoist = false # pedantic; no phantom dependencies
hoistPattern = ["@typescript-eslint/parser"] # TODO: Remove once we remove eslint from the project.
peer = false
minimumReleaseAge = 604800 # 7 days
minimumReleaseAgeExcludes = [
  "@maxmilton/*",
  # TODO: Remove these once bun support wildcards.
  "@maxmilton/eslint-config",
  "@maxmilton/oxlint-config",
  "@maxmilton/test-utils",
]

[test]
preload = ["./test/setup.ts"]
root = "./test/unit"
