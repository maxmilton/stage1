#:schema https://www.schemastore.org/bunfig.json

[run]
bun = true
noOrphans = true

[install]
auto = "disable"
peer = false
ignoreScripts = true
linker = "isolated"
hoist = false # pedantic; no phantom dependencies
minimumReleaseAge = 604800 # 7 days
minimumReleaseAgeExcludes = ["@maxmilton/oxlint-config", "@maxmilton/test-utils"]

[test]
preload = ["./test/setup.ts"]
pathIgnorePatterns = ["test/e2e/**", "**/*.bak/**"]
