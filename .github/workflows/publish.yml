name: publish

on:
  release:
    types: [published]

concurrency:
  group: npm-publish
  cancel-in-progress: false
  queue: max

permissions: {}

jobs:
  build:
    if: ${{ github.repository == 'maxmilton/stage1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-next\.(0|[1-9][0-9]*))?$ ]] || exit 1
          [[ "$GITHUB_REF" == "refs/tags/$RELEASE_TAG" ]] || exit 1
          [[ "$RELEASE_TAG" == "v$(jq -er '.version' package.json)" ]] || exit 1
          [[ "$(jq -r '.name' package.json)" == "stage1" ]] || exit 1
        shell: bash

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run lint
      - run: bun run test

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Pack and verify
        run: |
          npm pack --ignore-scripts --json > /tmp/pack.json
          jq -e '
            .[0].files | map(.path) |
            index("dist/index.js") != null and
            index("dist/index.d.ts") != null and
            index("dist/browser.js") != null and
            index("dist/browser.mjs") != null
          ' /tmp/pack.json
          mv -- "$(jq -er '.[0].filename' /tmp/pack.json)" publish.tgz
        shell: bash

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: publish.tgz
          path: publish.tgz
          archive: false
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/stage1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: publish.tgz

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Publish to npm
        run: |
          if [[ "$GITHUB_REF_NAME" == *"-next."* ]]; then
            NPM_TAG=next
          else
            NPM_TAG=latest
          fi
          npm publish ./publish.tgz --ignore-scripts --provenance --access public --tag "$NPM_TAG"
        shell: bash
