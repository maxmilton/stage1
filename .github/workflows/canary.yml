name: canary

on:
  schedule:
    - cron: "22 14 */3 * *"
  workflow_dispatch:

concurrency:
  group: bun-canary
  cancel-in-progress: true

permissions: {}

jobs:
  canary-bun:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: canary
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bun add -d --minimum-release-age=0 @types/bun@npm:bun-types@canary
      - run: bun run build
      - run: bun run lint
      - run: bun run test
