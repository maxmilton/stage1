name: ci

on:
  push:
    branches:
      - master
      - next
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test:ci --coverage-reporter=text --coverage-reporter=lcov
      - name: Report coverage
        if: ${{ github.repository_owner == 'maxmilton' }}
        uses: qltysh/qlty-action/coverage@c9b09987143d1e4ac955f4803c7bea742102feb5 # v2.4.0
        with:
          oidc: true
          files: coverage/lcov.info

  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .github/.node-version
      - name: Pack and verify
        run: .github/scripts/pack-and-verify.sh
      - run: test -f publish.tgz

  e2e:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - parallel:
          - name: Install WebKit system dependencies
            # Runtime libraries only; no media plugins or extra fonts.
            run: |
              sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
              opts=(-o Acquire::Languages=none -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Dpkg::Options::=--force-unsafe-io)
              for i in 1 2; do sudo timeout 60 apt-get "${opts[@]}" update && break; done
              sudo NEEDRESTART_SUSPEND=1 timeout 150 apt-get install "${opts[@]}" -y --no-install-recommends \
                libavif16 \
                libevent-2.1-7t64 \
                libflite1 \
                libgles2 \
                libgstreamer-gl1.0-0 \
                libgstreamer-plugins-extra1.0-0 \
                libgtk-4-1 \
                libharfbuzz-icu0 \
                libhyphen0 \
                libmanette-0.2-0 \
                libopus0 \
                libsecret-1-0 \
                libsoup-3.0-0 \
                libwayland-server0 \
                libx264-165
          - run: bun playwright install --no-shell chromium firefox webkit
          - run: bun run build
      - run: bun run test:e2e --reporter=github,html --project='*' --workers=100%
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run lint
